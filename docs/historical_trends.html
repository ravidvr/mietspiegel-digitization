<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mietspiegel Historical Trends — Rent Development Over Time</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117; color: #e4e6f0; min-height: 100vh;
    }
    .header {
      background: #151821; border-bottom: 1px solid #2a2e3e;
      padding: 12px 24px; display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .header h1 { font-size: 18px; font-weight: 700; color: #e4e6f0; }
    .header h1 span { color: #5b8def; }
    .header .nav a {
      color: #8b8fa3; text-decoration: none; font-size: 12px;
      padding: 4px 10px; border: 1px solid #2a2e3e; border-radius: 5px;
      transition: 0.2s;
    }
    .header .nav a:hover { color: #5b8def; border-color: #5b8def; }
    .container { max-width: 1300px; margin: 0 auto; padding: 20px; }

    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .summary-card {
      background: #1a1d28; border: 1px solid #2a2e3e; border-radius: 8px; padding: 14px;
    }
    .summary-card .label { font-size: 11px; color: #8b8fa3; text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-card .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
    .summary-card .value.green { color: #48bb78; }
    .summary-card .value.red { color: #f56565; }
    .summary-card .value.amber { color: #ecc94b; }
    .summary-card .value.blue { color: #5b8def; }

    .section {
      background: #1a1d28; border: 1px solid #2a2e3e; border-radius: 8px; padding: 20px; margin-bottom: 20px;
    }
    .section h2 { font-size: 16px; color: #ecc94b; margin-bottom: 12px; }

    .chart-container { position: relative; width: 100%; max-height: 450px; }
    .chart-container canvas { max-height: 420px; }

    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
    .controls label { font-size: 12px; color: #b0b0c0; }
    .controls select {
      background: #222639; color: #e4e6f0; border: 1px solid #2a2e3e; border-radius: 5px;
      padding: 5px 10px; font-size: 12px; cursor: pointer; outline: none;
    }
    .controls select:focus { border-color: #5b8def; }

    .growth-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .growth-table th {
      text-align: left; padding: 6px 8px; border-bottom: 2px solid #2a2e3e;
      color: #8b8fa3; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px;
    }
    .growth-table td { padding: 6px 8px; border-bottom: 1px solid #222639; }
    .growth-table tr:hover td { background: #1e2030; }
    .growth-table .rank { color: #666680; font-size: 11px; width: 2rem; }
    .growth-table .city-name { font-weight: 600; }
    .growth-table .price { text-align: right; font-variant-numeric: tabular-nums; }
    .growth-table .growth-pct { text-align: right; font-weight: 600; white-space: nowrap; }
    .growth-table .growth-pct.pos { color: #48bb78; }
    .growth-table .growth-pct.neg { color: #f56565; }
    .growth-table .city-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .bar-cell { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
    .bar-cell .bar { height: 8px; border-radius: 4px; min-width: 3px; }

    .city-detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }
    .city-card {
      background: #14141e; border: 1px solid #2a2e3e; border-radius: 6px; padding: 12px;
      display: flex; flex-direction: column;
    }
    .city-card h3 { font-size: 14px; margin-bottom: 4px; }
    .city-card .city-pop { font-size: 11px; color: #666680; margin-bottom: 6px; }
    .city-card .history-row { display: flex; justify-content: space-between; padding: 2px 0; color: #b0b0c4; font-size: 12px; }
    .city-card .history-row .year { color: #666680; }
    .city-card .growth-badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600;
      margin-top: 6px; margin-bottom: 4px;
    }
    .city-card .growth-badge.fast { background: #2a4422; color: #66dd88; }
    .city-card .growth-badge.avg { background: #222244; color: #7799cc; }
    .city-card .growth-badge.slow { background: #443322; color: #ddaa66; }

    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .filter-tag {
      background: #222238; border: 1px solid #3a3a55; border-radius: 14px;
      padding: 3px 10px; font-size: 11px; cursor: pointer; color: #b0b0c0;
    }
    .filter-tag:hover { border-color: #ecc94b; }
    .filter-tag.active { background: #ecc94b; color: #1a1a2e; border-color: #ecc94b; font-weight: 600; }

    .methodology { font-size: 12px; color: #666680; line-height: 1.6; }
    .methodology a { color: #5b8def; }
    .methodology strong { color: #8b8fa3; }

    .loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: #8b8fa3; gap: 8px; }
    .spinner { width: 16px; height: 16px; border: 2px solid #2a2e3e; border-top-color: #5b8def; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { text-align: center; padding: 12px; font-size: 11px; color: #666680; }
    footer a { color: #5b8def; text-decoration: none; }

    @media (max-width: 768px) {
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
      .growth-table { font-size: 11px; }
      .city-detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="header">
  <h1>📈 Mietspiegel <span>Historical Trends</span></h1>
  <div class="nav">
    <a href="index.html">🗺️ Map</a>
    <a href="cross-city-comparison.html">📊 Compare</a>
    <a href="about.html">About</a>
  </div>
</div>
<div class="container" id="app">
  <div class="loading"><div class="spinner"></div> Loading historical data...</div>
</div>
<footer>
  Data from official city Mietspiegel editions · Net cold rent per m² · Mittlere Wohnlage
  <br><a href="index.html">← Back to map</a> · <a href="https://github.com/ravidvr/mietspiegel-digitization">GitHub</a>
</footer>
<script>
let HISTORICAL_DATA = null;
let mainChart = null;
const COLORS = ['#5b8def','#48bb78','#ecc94b','#ed8936','#f56565','#6c5ce7','#48bb78','#e85555','#bb77dd','#66ccdd'];
const cityColor = {};

async function loadData() {
  const resp = await fetch('data/historical_mietspiegel.json');
  HISTORICAL_DATA = await resp.json();
  HISTORICAL_DATA.cities.forEach((c, i) => { cityColor[c.city] = COLORS[i % COLORS.length]; });
}

function buildChartData(metric) {
  const years = new Set();
  const datasets = [];
  HISTORICAL_DATA.cities.forEach((city) => {
    const vals = city.editions.map(e => {
      const lageData = city.by_lage[String(e.year)];
      const val = lageData ? lageData[metric] : null;
      years.add(e.year);
      return { year: e.year, value: val };
    });
    datasets.push({
      label: city.city,
      data: vals.sort((a,b) => a.year - b.year).map(v => v.value),
      borderColor: cityColor[city.city],
      backgroundColor: cityColor[city.city] + '22',
      tension: 0.2,
      pointRadius: 4,
      pointHoverRadius: 6,
      spanGaps: false,
      fill: false,
    });
  });
  return { labels: [...years].sort((a,b) => a-b), datasets };
}

function initChart(metric) {
  const ctx = document.getElementById('mainChart').getContext('2d');
  const chartData = buildChartData(metric);
  if (mainChart) mainChart.destroy();
  mainChart = new Chart(ctx, {
    type: 'line',
    data: chartData,
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { color: '#b0b0c0', font: { size: 11 }, usePointStyle: true, padding: 12 } },
        tooltip: {
          backgroundColor: '#1a1d28', titleColor: '#ecc94b', bodyColor: '#e4e6f0',
          borderColor: '#2a2e3e', borderWidth: 1, padding: 10,
          callbacks: { label: ctx => ctx.dataset.label + ': €' + ctx.parsed.y.toFixed(2) + '/m²' }
        }
      },
      scales: {
        x: { ticks: { color: '#8b8fa3', font: { size: 11 } }, grid: { color: '#1e1e2e' }, title: { display: true, text: 'Mietspiegel Edition Year', color: '#8b8fa3' } },
        y: { ticks: { color: '#8b8fa3', font: { size: 11 }, callback: v => '€' + v.toFixed(1) }, grid: { color: '#1e1e2e' }, title: { display: true, text: 'Net Cold Rent per m²', color: '#8b8fa3' } }
      }
    }
  });
}

function getGrowth(city, lookback) {
  const sorted = [...city.editions].sort((a,b) => a.year - b.year);
  const earliest = sorted[0];
  const latest = lookback === 'all' ? sorted[sorted.length-1] : sorted.slice(-lookback)[0];
  const ed1 = earliest.base_rent_per_sqm;
  const ed2 = latest.base_rent_per_sqm;
  const diff = ed2 - ed1;
  const pct = ((ed2 - ed1) / ed1 * 100);
  const years = latest.year - earliest.year;
  const annualized = years > 0 ? (Math.pow(ed2/ed1, 1/years) - 1) * 100 : 0;
  return { earliest, latest, diff, pct, annualized, years };
}

function getGrowthForPeriod(city, lookbackYears) {
  const sorted = [...city.editions].sort((a,b) => a.year - b.year);
  if (lookbackYears === 'all') return getGrowth(city, 'all');
  const latest = sorted[sorted.length-1];
  const cutoffYear = latest.year - lookbackYears;
  const ref = sorted.filter(e => e.year >= cutoffYear)[0] || sorted[0];
  const ed1 = ref.base_rent_per_sqm;
  const ed2 = latest.base_rent_per_sqm;
  const diff = ed2 - ed1;
  const pct = ((ed2 - ed1) / ed1 * 100);
  const years = latest.year - ref.year;
  const annualized = years > 0 ? (Math.pow(ed2/ed1, 1/years) - 1) * 100 : 0;
  return { earliest: ref, latest, diff, pct, annualized, years };
}

function renderGrowthTable(period) {
  const rows = HISTORICAL_DATA.cities.map(c => {
    const g = period === 'all' ? getGrowth(c, 'all') : getGrowthForPeriod(c, parseInt(period));
    return { city: c.city, ...g };
  });
  rows.sort((a,b) => b.pct - a.pct);
  const maxPct = Math.max(...rows.map(r => r.pct));
  const tbody = document.getElementById('growthBody');
  tbody.innerHTML = rows.map((r, i) => {
    const barW = (r.pct / maxPct * 100).toFixed(0);
    const cl = r.pct >= 0 ? 'pos' : 'neg';
    return `<tr>
      <td class="rank">#${i+1}</td>
      <td><span class="city-dot" style="background:${cityColor[r.city]}"></span><span class="city-name">${r.city}</span></td>
      <td class="price">€${r.earliest.base_rent_per_sqm.toFixed(2)}</td>
      <td class="price">€${r.latest.base_rent_per_sqm.toFixed(2)}</td>
      <td class="price">€${r.diff.toFixed(2)}</td>
      <td class="bar-cell"><div class="bar" style="width:${barW}px;background:${r.pct >= 0 ? '#48bb78' : '#f56565'}"></div><span class="growth-pct ${cl}">${r.pct >= 0 ? '+' : ''}${r.pct.toFixed(1)}%</span></td>
      <td class="growth-pct ${cl}" style="text-align:right;">+${r.annualized.toFixed(1)}%</td>
    </tr>`;
  }).join('');
}

function renderSummary() {
  const growthList = HISTORICAL_DATA.cities.map(c => {
    const g = getGrowth(c, 'all');
    return { city: c.city, ...g };
  });
  growthList.sort((a,b) => b.pct - a.pct);
  const fastest = growthList[0];
  const slowest = growthList[growthList.length-1];
  const avgGrowth = growthList.reduce((s, r) => s + r.pct, 0) / growthList.length;
  const allEditions = HISTORICAL_DATA.cities.reduce((s, c) => s + c.editions.length, 0);
  const munich = HISTORICAL_DATA.cities.find(c => c.city === 'Munich' || c.city === 'München');
  const munichLatest = munich ? munich.editions[munich.editions.length-1].base_rent_per_sqm : '—';

  document.getElementById('summaryCards').innerHTML = `
    <div class="summary-card"><div class="label">Cities Tracked</div><div class="value blue">${HISTORICAL_DATA.cities.length}</div></div>
    <div class="summary-card"><div class="label">Editions</div><div class="value amber">${allEditions}</div></div>
    <div class="summary-card"><div class="label">Avg Growth</div><div class="value green">+${avgGrowth.toFixed(1)}%</div></div>
    <div class="summary-card"><div class="label">Fastest</div><div class="value green">${fastest.city} +${fastest.pct.toFixed(0)}%</div></div>
    <div class="summary-card"><div class="label">Slowest</div><div class="value red">${slowest.city} +${slowest.pct.toFixed(0)}%</div></div>
    <div class="summary-card"><div class="label">Highest Rent</div><div class="value red" style="font-size:18px;">München €${munichLatest.toFixed ? munichLatest.toFixed(2) : munichLatest}/m²</div></div>
  `;
}

function renderCityDetails(filterCity) {
  const grid = document.getElementById('cityDetailGrid');
  const cities = filterCity === 'all'
    ? HISTORICAL_DATA.cities
    : HISTORICAL_DATA.cities.filter(c => c.city === filterCity);
  grid.innerHTML = cities.map(c => {
    const sorted = [...c.editions].sort((a,b) => b.year - a.year);
    const g = getGrowth(c, 'all');
    const growthLabel = g.pct >= 70 ? 'fast' : g.pct >= 35 ? 'avg' : 'slow';
    const growthText = g.pct >= 70 ? 'Fast growth' : g.pct >= 35 ? 'Moderate' : 'Below average';
    return `<div class="city-card">
      <h3>${c.city}</h3>
      <div class="city-pop">${c.state} · ${(c.population/1000).toFixed(0)}k residents</div>
      <div class="growth-badge ${growthLabel}">${growthText}: +${g.pct.toFixed(1)}%</div>
      <div>
        ${sorted.map(e => {
          const prevIdx = sorted.indexOf(e) + 1;
          const prev = sorted[prevIdx];
          const chg = prev ? ((e.base_rent_per_sqm - prev.base_rent_per_sqm) / prev.base_rent_per_sqm * 100) : 0;
          const arrow = chg > 0 ? '<span style="color:#48bb78">▲</span>' : (chg < 0 ? '<span style="color:#f56565">▼</span>' : '');
          return `<div class="history-row"><span class="year">${e.year}</span><span>€${e.base_rent_per_sqm.toFixed(2)}/m² ${arrow}${chg ? ' +'+chg.toFixed(1)+'%' : ''}</span></div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function populateCityFilter() {
  const container = document.getElementById('cityFilter');
  HISTORICAL_DATA.cities.forEach(c => {
    const tag = document.createElement('span');
    tag.className = 'filter-tag';
    tag.dataset.city = c.city;
    tag.textContent = c.city;
    container.appendChild(tag);
  });
}

async function init() {
  try {
    await loadData();
  } catch(e) {
    document.getElementById('app').innerHTML = '<div class="loading" style="color:#f56565">Failed to load historical data. Make sure data/historical_mietspiegel.json is accessible.</div>';
    return;
  }

  document.getElementById('app').innerHTML = `
    <div class="summary-grid" id="summaryCards"></div>
    <div class="section">
      <h2>Rent Development Over Time</h2>
      <div class="controls">
        <label>Metric:</label>
        <select id="metricSelector">
          <option value="mittel">Mittlere Wohnlage (middle)</option>
          <option value="einfach">Einfache Wohnlage (simple)</option>
          <option value="gut">Gute Wohnlage (good)</option>
        </select>
      </div>
      <div class="chart-container"><canvas id="mainChart"></canvas></div>
      <p style="font-size:11px;color:#666680;margin-top:6px;">Click city names in the legend to toggle visibility.</p>
    </div>
    <div class="section">
      <h2>Rent Growth Ranking</h2>
      <p style="font-size:12px;color:#b0b0c0;margin-bottom:10px;">Total rent increase from earliest to latest Mietspiegel edition · Mittlere Wohnlage</p>
      <div class="filter-row" id="growthFilter">
        <span class="filter-tag active" data-period="all">Total</span>
        <span class="filter-tag" data-period="5">Last ~5 years</span>
        <span class="filter-tag" data-period="3">Last ~3 years</span>
      </div>
      <table class="growth-table">
        <thead><tr><th></th><th>City</th><th style="text-align:right;">First</th><th style="text-align:right;">Latest</th><th style="text-align:right;">Increase</th><th style="text-align:right;">Growth %</th><th style="text-align:right;">Annualized</th></tr></thead>
        <tbody id="growthBody"></tbody>
      </table>
    </div>
    <div class="section">
      <h2>Edition History by City</h2>
      <div class="filter-row" id="cityFilter">
        <span class="filter-tag active" data-city="all">All</span>
      </div>
      <div class="city-detail-grid" id="cityDetailGrid"></div>
    </div>
    <div class="section">
      <h2>Methodology &amp; Sources</h2>
      <div class="methodology">
        <p><strong>What this tracks:</strong> The official Mietspiegel base rent table values for "mittlere Wohnlage" (middle residential location), 60–80 sqm apartments, 1965–1974 building age cohort. Values are net cold rent per square meter.</p>
        <p style="margin-top:6px;"><strong>Data sources:</strong> Values from official city Mietspiegel PDFs published by each city's administration.</p>
        <p style="margin-top:6px;"><strong>Limitations:</strong> Mietspiegel tables differ in structure between cities and across years. Some values are interpolated. Only "qualifizierte Mietspiegel" editions are tracked.</p>
      </div>
    </div>
  `;

  document.getElementById('growthFilter').addEventListener('click', e => {
    const tag = e.target.closest('.filter-tag');
    if (!tag) return;
    document.querySelectorAll('#growthFilter .filter-tag').forEach(t => t.classList.remove('active'));
    tag.classList.add('active');
    renderGrowthTable(tag.dataset.period);
  });

  document.getElementById('cityFilter').addEventListener('click', e => {
    const tag = e.target.closest('.filter-tag');
    if (!tag) return;
    document.querySelectorAll('#cityFilter .filter-tag').forEach(t => t.classList.remove('active'));
    tag.classList.add('active');
    renderCityDetails(tag.dataset.city);
  });

  document.getElementById('metricSelector').addEventListener('change', e => initChart(e.target.value));

  renderSummary();
  populateCityFilter();
  initChart('mittel');
  renderGrowthTable('all');
  renderCityDetails('all');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
