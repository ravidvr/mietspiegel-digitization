<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berlin Rent Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
:root{--bg:#0f1117;--surface:#1a1d28;--surface2:#222639;--border:#2a2e3e;--text:#e4e6f0;--text-dim:#8b8fa3;--accent:#5b8def;--green:#48bb78;--yellow:#ecc94b;--orange:#ed8936;--red:#f56565}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.header{background:#151821;border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.header h1{font-size:16px;font-weight:700;color:#fff}.header h1 span{color:var(--accent)}
.h-right{display:flex;align-items:center;gap:6px}
.h-btn{background:transparent;border:1px solid rgba(255,255,255,.15);color:#e4e6f0;padding:4px 8px;border-radius:4px;font-size:11px;cursor:pointer}.h-btn:hover{background:rgba(255,255,255,.1)}
.bdg{background:var(--accent);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}

#map{width:100%;height:calc(100vh - 44px)}

.map-legend{position:absolute;bottom:16px;left:12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:10px;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.map-legend .r{display:flex;align-items:center;gap:6px;margin:2px 0}
.map-legend .d{width:16px;height:3px;border-radius:2px;flex-shrink:0}

.map-tooltip{position:absolute;top:56px;right:10px;max-width:360px;max-height:calc(100% - 80px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;z-index:1001;box-shadow:0 4px 16px rgba(0,0,0,.3);font-size:12px;display:none}
.map-tooltip .close{float:right;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;padding:0 2px}
.map-tooltip h3{font-size:14px;margin-bottom:4px}
.map-tooltip .val{font-size:22px;font-weight:700;color:var(--accent)}
.map-tooltip .sub{font-size:10px;color:var(--text-dim)}
.map-tooltip .insight{font-size:11px;font-weight:600}
.map-tooltip .row{display:flex;justify-content:space-between;font-size:10px;margin:1px 0}

.district-panel{position:absolute;top:56px;left:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.3);max-height:calc(100% - 100px);overflow-y:auto;font-size:11px;max-width:200px}
.district-panel h4{font-size:11px;font-weight:700;margin-bottom:6px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
.district-panel .d-row{display:flex;justify-content:space-between;padding:3px 4px;border-radius:3px;cursor:pointer;margin:1px 0}
.district-panel .d-row:hover{background:var(--surface2)}
.district-panel .d-row .d-name{font-weight:600;font-size:10px}
.district-panel .d-row .d-rent{color:var(--text-dim);font-size:10px}

@media(max-width:768px){
  .map-tooltip{top:auto;bottom:0;left:0;right:0;max-width:100%;border-radius:12px 12px 0 0;max-height:40vh}
  .district-panel{display:none}
  .map-legend{bottom:8px;left:4px;font-size:9px;padding:5px 8px}
}
</style>
</head>
<body>

<div class="header">
  <h1>🏠 Berlin <span>Rent Map</span></h1>
  <div class="h-right">
    <span class="bdg" id="cell-count">...</span>
    <button class="h-btn" id="zensus-btn" onclick="toggleSource()">📋 Census</button>
    <a class="h-btn" href="index.html">🇩🇪 Germany</a>
    <a class="h-btn" href="about.html">About</a>
  </div>
</div>

<div id="map">
  <div class="map-legend" id="legend">
    <div style="font-weight:600;margin-bottom:3px">Berlin rent (Immoscout24)</div>
    <div class="r"><span class="d" style="background:#b01020"></span> +2σ above Berlin avg</div>
    <div class="r"><span class="d" style="background:#e04030"></span> +1σ</div>
    <div class="r"><span class="d" style="background:#e0d040"></span> Berlin average</div>
    <div class="r"><span class="d" style="background:#7fc440"></span> −1σ</div>
    <div class="r"><span class="d" style="background:#00a550"></span> −2σ below Berlin avg</div>
  </div>
  <div class="district-panel" id="dpanel"><h4>Districts</h4><div id="dlist">Loading...</div></div>
  <div class="map-tooltip" id="tooltip"></div>
</div>

<script>
// ─── Data ──────────────────────────────────────────────────────
let map, heatLayer, berlinLayer, distData = null;
let immoMean = 0, immoStd = 0, immoGrids = [];
let zensusMean = 0, zensusStd = 0, zensusCells = [];
let useZensus = false;

function zScore(v, mean, std) { return std > 0 ? (v - mean) / std : 0; }

function heatGradient(z) { return Math.max(0, Math.min(1, (z + 3) / 6)); }

function heatParams(z) {
  if (z <= 11) return { radius: 18, blur: 10, minO: 0.2 };
  if (z <= 13) return { radius: 12, blur: 6, minO: 0.25 };
  if (z <= 15) return { radius: 8, blur: 4, minO: 0.30 };
  return { radius: 14, blur: 3, minO: 0.35 };
}

// ─── Heatmap ───────────────────────────────────────────────────
function buildHeat() {
  if (heatLayer) map.removeLayer(heatLayer);
  const cells = useZensus ? zensusCells : immoGrids;
  const mean = useZensus ? zensusMean : immoMean;
  const std  = useZensus ? zensusStd  : immoStd;

  const data = useZensus
    ? cells.map(c => [c[0], c[1], heatGradient(zScore(c[2], mean, std))])
    : cells.map(g => [g.lat, g.lng, heatGradient(zScore(g.rent, mean, std))]);

  const p = heatParams(map.getZoom());
  heatLayer = L.heatLayer(data, {
    radius: p.radius, blur: p.blur, max: 1.0, minOpacity: p.minO,
    gradient: {0:'#00a550',.2:'#7fc440',.4:'#e0d040',.6:'#f09030',.8:'#e04030',1:'#b01020'}
  }).addTo(map);
}

// ─── Districts ─────────────────────────────────────────────────
async function loadDistricts() {
  try {
    const r = await fetch('data/processed/berlin-districts-choropleth.geojson');
    distData = await r.json();
    berlinLayer = L.geoJSON(distData, {
      style: f => {
        const a = f.properties.avg_rent || 12;
        return { fillColor: a<10?'#48bb78':a<11?'#86c97a':a<11.5?'#ecc94b':a<12?'#ed8936':'#f56565', fillOpacity: 0.2, weight: 1.5, color: 'var(--text-dim)', dashArray: '4 2' };
      },
      onEachFeature: (f, layer) => {
        layer.bindTooltip(`<b>${f.properties.district}</b><br>ø €${f.properties.avg_rent}/m²<br>${f.properties.total_addresses.toLocaleString()} addresses`, {sticky:true});
        layer.on('click', () => showDistrict(f.properties));
      }
    }).addTo(map);

    // District list
    const list = document.getElementById('dlist');
    const districts = distData.features.map(f => f.properties).sort((a,b) => a.avg_rent - b.avg_rent);
    list.innerHTML = districts.map(d => `
      <div class="d-row" onclick="zoomToDistrict('${d.district}')">
        <span class="d-name">${d.district}</span>
        <span class="d-rent">€${d.avg_rent}</span>
      </div>`).join('');
  } catch(e) { console.error('Districts:', e); }
}

function zoomToDistrict(name) {
  const f = distData.features.find(f => f.properties.district === name);
  if (!f) return;
  const layer = Object.values(berlinLayer._layers).find(l => l.feature === f);
  if (layer) {
    map.fitBounds(layer.getBounds(), {padding:[30,30], maxZoom:14});
    showDistrict(f.properties);
  }
}

function showDistrict(p) {
  document.getElementById('tooltip').innerHTML = `
    <button class="close" onclick="this.parentElement.style.display='none'">×</button>
    <h3>${p.district}</h3>
    <div class="sub">${p.total_addresses.toLocaleString()} addresses</div>
    <div style="margin-top:8px">
      <div class="row"><span>🟢 Simple areas</span><b>${p.einfach_pct}%</b></div>
      <div class="row"><span>🟡 Medium areas</span><b>${p.mittel_pct}%</b></div>
      <div class="row"><span>🔴 Good areas</span><b>${p.gut_pct}%</b></div>
    </div>
    <div style="margin-top:10px;padding:8px;background:var(--surface2);border-radius:4px;text-align:center">
      <div style="font-size:22px;font-weight:700;color:${p.avg_rent<10?'#48bb78':p.avg_rent<11.5?'#ecc94b':p.avg_rent<12.5?'#ed8936':'#f56565'}">ø €${p.avg_rent}/m²</div>
      <div class="sub">Estimated average net cold rent</div>
    </div>`;
  document.getElementById('tooltip').style.display = 'block';
}

// ─── Click ─────────────────────────────────────────────────────
function setupClick() {
  map.on('click', e => {
    const {lat, lng} = e.latlng;

    // Find nearest Immoscout cell
    let ibest=null,ibestD=Infinity;
    for (const g of immoGrids) {
      const d=(g.lat-lat)**2+(g.lng-lng)**2;
      if (d<ibestD){ibestD=d;ibest=g;}
    }
    const threshold = 0.001 * Math.pow(2, 14 - map.getZoom());

    // Find nearest Zensus cell
    let zbest=null,zbestD=Infinity;
    for (const zc of zensusCells) {
      const d=(zc[0]-lat)**2+(zc[1]-lng)**2;
      if (d<zbestD){zbestD=d;zbest=zc;}
    }

    if (!ibest || ibestD > threshold) return;

    const loc = ibest.plz ? `PLZ ${ibest.plz} · ${ibest.location || 'Berlin'}` : 'Berlin';
    const zi = zScore(ibest.rent, immoMean, immoStd);
    const above = ibest.rent > immoMean;

    let html = `<button class="close" onclick="this.parentElement.style.display='none'">×</button>
      <h3>📍 ${loc}</h3>
      <div class="val">€${ibest.rent}/m² <span class="sub">(${ibest.year})</span></div>
      <div class="insight" style="color:${above?'var(--red)':'var(--green)'};margin-top:4px">
        ${above?'Above':'Below'} Berlin average (€${immoMean}/m²)
      </div>`;

    // Zensus comparison
    if (zbest && zbestD < threshold) {
      const zsRent = zbest[2];
      const diff = ibest.rent - zsRent;
      const pct = diff > 0 ? `${Math.round(diff/zsRent*100)}% more` : `${Math.round(Math.abs(diff)/zsRent*100)}% less`;
      const pctColor = diff/zsRent > 0.2 ? 'var(--red)' : diff/zsRent > 0.05 ? 'var(--orange)' : 'var(--green)';
      html += `<div style="margin-top:10px;padding:8px;background:var(--surface2);border-radius:4px">
        <div style="font-weight:600;font-size:11px;margin-bottom:4px">📊 What residents actually pay</div>
        <div class="row"><span>Official census (2022)</span><span style="font-weight:700;font-size:14px">€${zsRent}/m²</span></div>
        <div style="margin-top:3px;font-size:10px;color:${pctColor};font-weight:600">
          New listings cost <b>${pct}</b> than current rents
        </div>
      </div>`;
    }

    document.getElementById('tooltip').innerHTML = html;
    document.getElementById('tooltip').style.display = 'block';
  });
}

// ─── Toggle data source ────────────────────────────────────────
async function toggleSource() {
  useZensus = !useZensus;
  const btn = document.getElementById('zensus-btn');
  const leg = document.querySelector('#legend div:first-child');
  if (useZensus) {
    btn.style.background='var(--accent)';btn.style.color='#fff';btn.textContent='📋 Census ✓';
    leg.textContent = 'Berlin rent (Zensus 2022)';
  } else {
    btn.style.background='';btn.style.color='';btn.textContent='📋 Census';
    leg.textContent = 'Berlin rent (Immoscout24)';
  }
  buildHeat();
}

// ─── Zoom ──────────────────────────────────────────────────────
map.on('zoomend', () => { if (heatLayer) buildHeat(); });

// ─── Init ──────────────────────────────────────────────────────
async function init() {
  map = L.map('map', {center:[52.52,13.405],zoom:12,scrollWheelZoom:true,zoomControl:false});
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'&copy; OSM',maxZoom:18}).addTo(map);

  // Load Immoscout Berlin
  try {
    const r = await fetch('data/processed/berlin_immoscout.json?v=1');
    const d = await r.json();
    immoMean = d.mean; immoStd = d.std; immoGrids = d.grids;
    document.getElementById('cell-count').textContent = d.clean + ' cells';
  } catch(e) { console.error(e); }

  // Load Zensus Berlin
  try {
    const r = await fetch('data/processed/berlin_zensus.json?v=1');
    const d = await r.json();
    zensusMean = d.mean; zensusStd = d.std; zensusCells = d.cells_slim;
  } catch(e) { console.error(e); }

  buildHeat();
  loadDistricts();
  setupClick();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
