<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Can the data spot a rent rise? — Mietspiegel Digitization" />
<meta property="og:description" content="Berlin rents vary so much that a small rise can hide in the noise. This experiment works out how big a city-wide rise has to be before the data can reliably spot it." />
<title>Experiments — Mietspiegel Digitization</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d28;--surface2:#222639;--border:#2a2e3e;--text:#e4e6f0;--text-dim:#8b8fa3;--accent:#5b8def;--accent2:#6c5ce7;--green:#48bb78;--yellow:#ecc94b;--orange:#ed8936;--red:#f56565;--header-bg:#151821}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.header{background:var(--header-bg);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100}
.header h1{font-size:16px;font-weight:700;color:#fff}.header h1 span{color:var(--accent)}
.h-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.h-btn{background:transparent;border:1px solid rgba(255,255,255,.15);color:#e4e6f0;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer;transition:.15s;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.h-btn:hover{background:rgba(255,255,255,.1);border-color:var(--accent)}
.h-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.container{max-width:800px;margin:0 auto;padding:32px 20px 60px}

/* Question and answer */
.kicker{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.intro h2{font-size:30px;font-weight:700;line-height:1.25;color:#fff;margin-bottom:20px}
.answer{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 24px;margin-bottom:20px}
.answer .big{font-size:48px;font-weight:700;line-height:1.1;color:#fff}
.answer .big small{font-size:20px;font-weight:600;color:var(--text-dim)}
.answer p{font-size:16px;margin-top:6px}
.lede{font-size:16px;color:var(--text-dim);line-height:1.65;margin-bottom:28px}
.lede strong{color:var(--text)}

/* Example rises against the line */
.rises{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 24px;margin-bottom:24px}
.rises h3{font-size:16px;font-weight:700;margin-bottom:18px}
.rise{margin-bottom:24px}
.rise-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 12px;font-size:15px;margin-bottom:8px}
.rise-head .name{font-weight:600}
.rise-head .val{font-weight:700;color:#fff}
.track{position:relative;height:20px;background:rgba(255,255,255,.04)}
.bar{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.line{position:absolute;top:-6px;bottom:-6px;border-left:2px dashed var(--text)}
.rise p{font-size:14px;color:var(--text-dim);margin-top:8px}
.rise p strong{color:var(--text)}
.key{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-dim);border-top:1px solid var(--border);padding-top:14px}
.key .dash{height:18px;border-left:2px dashed var(--text)}
.meaning{font-size:16px;line-height:1.65;padding-left:16px;border-left:3px solid var(--accent);margin-bottom:28px}

/* How this was worked out */
.how{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 24px}
.how summary{cursor:pointer;font-size:15px;font-weight:600}
.how p{font-size:14px;color:var(--text-dim);line-height:1.65;margin-top:12px}
.how a{color:var(--accent)}
.formula{background:var(--surface2);border-radius:6px;padding:12px;margin-top:12px;font-family:monospace;font-size:13px;color:var(--accent);text-align:center;overflow-x:auto}
.table-wrap{overflow-x:auto;margin-top:12px}
.nums{width:100%;border-collapse:collapse;font-size:13px}
.nums th,.nums td{padding:8px;text-align:left;border-bottom:1px solid var(--border)}
.nums th{color:var(--text-dim);font-weight:600}
.nums .n{text-align:right;font-variant-numeric:tabular-nums}

.footer{border-top:1px solid var(--border);padding:16px 20px;text-align:center;font-size:11px;color:var(--text-dim);margin-top:40px}
.footer a{color:var(--accent);text-decoration:none}
.footer .sep{margin:0 6px;opacity:.5}

@media(max-width:768px){
  .container{padding:20px 16px 40px}
  .intro h2{font-size:24px}
  .answer .big{font-size:40px}
  .answer,.rises,.how{padding:16px}
}
</style>
</head>
<body>

<div class="header">
  <h1>🔬 <span>Experiments</span></h1>
  <div class="h-right">
    <a class="h-btn" href="index.html">📊 Overview</a>
    <a class="h-btn" href="berlin.html">🗺️ Map</a>
    <a class="h-btn" href="cross-city-comparison.html">📊 Compare</a>
    <a class="h-btn" href="historical_trends.html">📈 Trends</a>
    <a class="h-btn active" href="experiments.html">🔬 Experiments</a>
    <a class="h-btn" href="data.html">💾 Data</a>
    <a class="h-btn" href="about.html">About</a>
  </div>
</div>

<div class="container">
  <div id="content">
    <div style="display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text-dim);gap:8px">
      <div style="width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite"></div>
      Loading experiment results...
    </div>
  </div>
</div>

<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<div class="footer">
  <a href="https://github.com/ravidvr/mietspiegel-digitization" target="_blank">GitHub</a>
  <span class="sep">·</span>
  <a href="https://github.com/ravidvr/mietspiegel-digitization/tree/main/experiments" target="_blank">Experiment Source Code</a>
  <span class="sep">·</span>
  <span>CC BY-SA 4.0</span>
</div>

<script>
// Turns €/m² into € a month for one example flat (an illustration, not a Berlin average)
const FLAT_SQM = 60;

async function init() {
  try {
    const data = await fetch('data/processed/experiment_results.json').then(r => r.json());
    render(data);
  } catch(e) {
    document.getElementById('content').innerHTML = '<div style="text-align:center;padding:40px;color:var(--red)">❌ Couldn\'t load the experiment results</div>';
  }
}

function render(data) {
  const mde = data.mde || {};
  const line = mde.value_eur_per_sqm;
  if (!isNum(line)) throw new Error('experiment_results.json has no MDE value');
  const rises = (data.scenarios || []).filter(s => isNum(s.rent_delta_per_sqm));
  const lineText = '€' + line.toFixed(2);
  let html = '';

  // Question and answer
  html += '<div class="intro">';
  html += '<div class="kicker">Berlin rent experiment</div>';
  html += '<h2>How big does a rent rise have to be before the data can spot it?</h2>';
  html += '<div class="answer"><div class="big">' + lineText + ' <small>per m²</small></div>';
  html += '<p>The smallest city-wide rise this data can reliably spot' + (isNum(mde.pct_of_avg) ? ', about ' + mde.pct_of_avg + '% of the average asking rent' : '') + '.</p></div>';
  html += '<p class="lede"><strong>Why there\'s a limit:</strong> rents differ a lot from one part of Berlin to another. This check compares asking rents in 361 one-kilometre squares of the city, and a small rise can get lost in that spread.</p>';
  html += '</div>';

  // Example rises against the line
  if (rises.length) {
    const max = Math.max(line, ...rises.map(s => Math.abs(s.rent_delta_per_sqm))) * 1.15;
    const pos = v => (v / max * 100).toFixed(1) + '%';
    html += '<div class="rises"><h3>Example rises, compared with the ' + lineText + ' line</h3>';
    for (const s of rises) {
      const v = s.rent_delta_per_sqm;
      const month = '€' + Math.round(Math.abs(v) * FLAT_SQM) + (v < 0 ? ' less' : ' more') + ' a month on a ' + FLAT_SQM + ' m² flat';
      html += '<div class="rise">';
      html += '<div class="rise-head"><span class="name">' + esc(plainName(s.scenario)) + '</span><span class="val">' + (v < 0 ? '−' : '+') + '€' + Math.abs(v).toFixed(2) + ' per m²</span></div>';
      html += '<div class="track" aria-hidden="true"' + (isNum(s.mde_vs_effect) ? ' title="' + s.mde_vs_effect + '× the ' + lineText + ' line"' : '') + '>';
      html += '<div class="bar" style="width:' + pos(Math.abs(v)) + '"></div><div class="line" style="left:' + pos(line) + '"></div></div>';
      html += '<p>' + (spotted(s, line)
        ? '<strong>Big enough to spot.</strong> About ' + month + '.'
        : '<strong>Too small to spot reliably,</strong> yet still about ' + month + '.') + '</p>';
      html += '</div>';
    }
    html += '<div class="key"><span class="dash" aria-hidden="true"></span>Dashed line: ' + lineText + ' per m², the smallest rise this data can reliably spot</div>';
    html += '</div>';
  }

  html += '<p class="meaning"><strong>What it means:</strong> a rent rise can cost tenants real money and still be too small for city-wide data to spot. Before anyone claims a policy pushed rents up or down, it\'s worth checking that the data could see a change that size.</p>';

  // How this was worked out (for technical readers)
  html += '<details class="how"><summary>How this was worked out</summary>';
  html += '<p>The ' + lineText + ' line is the minimum detectable effect (MDE) of a two-sample z-test: the smallest change a before-and-after comparison of the 361 squares would catch 8 times out of 10, with a 5% risk of a false alarm.</p>';
  if (data.methodology) html += '<p>' + esc(data.methodology) + '</p>';
  if (mde.formula) html += '<div class="formula">' + esc(mde.formula) + '</div>';
  if (rises.length) {
    html += '<div class="table-wrap"><table class="nums"><thead><tr><th>Example</th><th class="n">Rise (€/m²)</th><th class="n">Rise ÷ MDE</th><th>Detectable at 80% power?</th></tr></thead><tbody>';
    for (const s of rises) {
      html += '<tr><td>' + esc(s.scenario) + '</td><td class="n">' + s.rent_delta_per_sqm.toFixed(2) + '</td>';
      html += '<td class="n">' + (isNum(s.mde_vs_effect) ? s.mde_vs_effect + '×' : '–') + '</td><td>' + (spotted(s, line) ? 'Yes' : 'No') + '</td></tr>';
    }
    html += '</tbody></table></div>';
  }
  html += '<p>Rents: <a href="https://doi.org/10.7807/IMMO:REDX:PUF:V16" target="_blank" rel="noopener">RWI-GEO-REDX</a> (ImmoScout24 listings), Berlin 1 km grid. ';
  html += 'Calculated by <a href="https://github.com/ravidvr/mietspiegel-digitization/blob/main/experiments/generate_experiment_results.py" target="_blank" rel="noopener">experiments/generate_experiment_results.py</a>.</p>';
  html += '</details>';

  document.getElementById('content').innerHTML = html;
}

// Prefer the generator's verdict; fall back to comparing the rise with the line
function spotted(s, line) {
  return typeof s.detectable === 'boolean' ? s.detectable : Math.abs(s.rent_delta_per_sqm) > line;
}

// "A: +5% uniform rent increase" → "Rents up 5% everywhere"; other labels pass through
function plainName(label) {
  label = String(label || '').replace(/^[A-Z]:\s*/, '');
  const m = /^[+-]?(\d+(?:\.\d+)?)% uniform rent (increase|decrease)$/.exec(label);
  return m ? 'Rents ' + (m[2] === 'decrease' ? 'down ' : 'up ') + m[1] + '% everywhere' : label;
}

function isNum(v) { return typeof v === 'number' && isFinite(v); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
