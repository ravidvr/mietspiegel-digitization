<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berliner Immobilienmarkt 2024 — Marktbericht Dashboard</title>
<meta property="og:title" content="Berliner Immobilienmarkt 2024">
<meta property="og:description" content="Interaktive Karte des Berliner Immobilienmarktberichts 2024/2025 — Kaufpreise, Geldumsatz, Kauffälle pro Bezirk. Daten: Gutachterausschuss Berlin.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0f1117;--surface:#1a1d28;--surface2:#222639;--border:#2a2e3e;--text:#e4e6f0;--text-dim:#8b8fa3;--accent:#5b8def;--green:#48bb78;--yellow:#ecc94b;--orange:#ed8936;--red:#f56565}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}

.header{background:#151821;border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.header h1{font-size:16px;font-weight:700;color:#fff}.header h1 span{color:var(--accent)}
.h-right{display:flex;align-items:center;gap:6px}
.h-btn{background:transparent;border:1px solid rgba(255,255,255,.15);color:var(--text);padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer;text-decoration:none;white-space:nowrap}
.h-btn:hover{background:rgba(255,255,255,.1)}
.h-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.bdg{background:var(--accent);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}

.controls{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--surface2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.controls label{font-size:11px;color:var(--text-dim);white-space:nowrap}
.controls select{padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:11px;min-width:140px}
.controls select:focus{outline:none;border-color:var(--accent)}

#map{width:100%;height:calc(100vh - 90px)}

.district-panel{position:absolute;top:92px;left:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.3);max-height:calc(100% - 120px);overflow-y:auto;font-size:12px;max-width:250px}
.district-panel h4{font-size:11px;font-weight:700;margin-bottom:6px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
.district-panel .d-row{display:flex;justify-content:space-between;padding:4px 5px;border-radius:3px;cursor:pointer;margin:1px 0;gap:6px}
.district-panel .d-row:hover{background:var(--surface2)}
.district-panel .d-row .d-name{font-weight:600;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.district-panel .d-row .d-val{color:var(--text-dim);font-size:11px;flex-shrink:0}

.map-legend{position:absolute;bottom:16px;left:10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:10px;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.map-legend .r{display:flex;align-items:center;gap:6px;margin:2px 0}
.map-legend .d{width:16px;height:3px;border-radius:2px;flex-shrink:0}
.map-legend .title{font-weight:600;margin-bottom:3px;font-size:10px}

.tooltip{position:absolute;top:92px;right:10px;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;z-index:1001;box-shadow:0 4px 16px rgba(0,0,0,.3);font-size:12px;display:none;max-height:calc(100% - 120px);overflow-y:auto}
.tooltip .close{float:right;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;padding:0 2px}
.tooltip h3{font-size:14px;margin-bottom:4px}
.tooltip .val{font-size:22px;font-weight:700;color:var(--accent)}
.tooltip .sub{font-size:10px;color:var(--text-dim)}
.tooltip .row{display:flex;justify-content:space-between;font-size:10px;margin:1px 0}
.tooltip table{width:100%;font-size:10px;border-collapse:collapse;margin:6px 0}
.tooltip td,.tooltip th{padding:2px 4px;text-align:right}
.tooltip th{color:var(--text-dim);font-weight:500;text-align:left}
.tooltip .hr{border-top:1px solid var(--border);margin:6px 0}

.leaflet-tooltip{background:var(--surface)!important;color:var(--text)!important;border:1px solid var(--border)!important;border-radius:6px!important;padding:6px 10px!important;font-size:12px!important;font-weight:500!important;box-shadow:0 2px 8px rgba(0,0,0,.4)!important}
.leaflet-tooltip b{color:#fff;font-size:13px}
.leaflet-tooltip:before{border-top-color:var(--surface)!important}
.leaflet-popup-content-wrapper{background:var(--surface)!important;color:var(--text)!important;border-radius:8px!important}
.leaflet-popup-tip{background:var(--surface)!important}
.leaflet-popup-close-button{color:var(--text-dim)!important}

@media(max-width:768px){
  .header{padding:8px 10px;gap:4px}.header h1{font-size:14px}
  .controls{padding:6px 8px;gap:4px}
  .controls select{font-size:16px;min-height:36px}
  #map{height:60vh;min-height:350px}
  .district-panel{display:none}
  .tooltip{top:auto;bottom:0;left:0;right:0;max-width:100%;border-radius:12px 12px 0 0;max-height:50vh}
  .map-legend{bottom:8px;left:4px;font-size:9px;padding:5px 8px}
}
</style>
</head>

<div class="header">

  <label for="yearSelect" style="margin-left:8px">Jahr:</label>
  <select id="yearSelect" onchange="switchMetric()">
    <option value="2024">2024</option>
    <option value="2023">2023 (Vorjahr)</option>

  <span style="font-size:10px;color:var(--text-dim);margin-left:auto">Daten: Gutachterausschuss Berlin · dl-de/zero-2-0</span>
</div>

<div id="map">

</div>

function getMetricLabel(metric) {
  const labels = {
    geldumsatz: 'Geldumsatz gesamt', geldumsatz_bebaut: 'Geldumsatz — bebaute Grundstücke',
    geldumsatz_we: 'Geldumsatz — Wohnungseigentum', kauffaelle: 'Kauffälle gesamt',
    kauffaelle_we: 'Kauffälle — Wohnungseigentum', flaeche: 'Flächenumsatz',
    condo_resale: 'ETW Weiterverkauf (ø €/m²)', condo_neubau: 'ETW Neubau (ø €/m²)',
    brw_min: 'Bodenrichtwert minimal (€/m²)', brw_max: 'Bodenrichtwert maximal (€/m²)',
  };
  return labels[metric] || metric;
}

function getMetricUnit(metric) {
  if (metric.startsWith('geldumsatz')) return 'Mio. €';
  if (metric.startsWith('kauffaelle')) return 'Kauffälle';
  if (metric === 'flaeche') return 'ha';
  return '€/m²';
}

function formatVal(v, metric) {
  if (v == null) return '—';
  if (metric.startsWith('geldumsatz')) return v.toFixed(1) + ' Mio. €';
  if (metric.startsWith('kauffaelle')) return v.toLocaleString();
  if (metric === 'flaeche') return v.toFixed(1) + ' ha';
  return v.toFixed(0) + ' €/m²';
}

// ─── Map ───────────────────────────────────────────────────────
function buildMap() {
  const vals = BEZIRKE.map(b => getMetricValue(b, currentMetric)).filter(v => v != null);
  const min = Math.min(...vals);
  const max = Math.max(...vals);

  // Update choropleth
  if (geoLayer && geoData) {
    geoLayer.setStyle(feature => {
      const v = getMetricValue(feature.properties.district, currentMetric);
      return {
        fillColor: getColor(v, min, max),
        fillOpacity: 0.25, weight: 2, color: '#5b6a8a', dashArray: '4 2'
      };
    });
  }

  // Update legend
  const steps = 5;
  let legendHTML = `<div class="title">${getMetricLabel(currentMetric)}</div>`;
  for (let i = 0; i < steps; i++) {
    const t = i / (steps - 1);
    const v = min + t * (max - min);
    legendHTML += `<div class="r"><span class="d" style="background:${getColor(v, min, max)}"></span> ${formatVal(v, currentMetric)}</div>`;
  }
  document.getElementById('legend').innerHTML = legendHTML;

  // Update district panel
  const sorted = BEZIRKE.map(b => ({bezirk: b, val: getMetricValue(b, currentMetric)}))
    .sort((a,b) => (b.val||0) - (a.val||0));
  const dlist = document.getElementById('dlist');
  dlist.innerHTML = sorted.map(d => `
    <div class="d-row" onclick="zoomToDistrict('${d.bezirk}')">
      <span class="d-name">${d.bezirk}</span>
      <span class="d-val">${formatVal(d.val, currentMetric)}</span>
    </div>`).join('');
}

function zoomToDistrict(name) {
  const f = geoData.features.find(f => f.properties.district === name);
  if (!f) return;
  const layer = Object.values(geoLayer._layers).find(l => l.feature === f);
  if (layer) {
    map.fitBounds(layer.getBounds(), {padding:[30,30], maxZoom:14});
    showTooltip(name);
  }
}

function switchMetric() {
  currentMetric = document.getElementById('metricSelect').value;
  buildMap();
}

// ─── Tooltip ───────────────────────────────────────────────────
function showTooltip(bezirk) {
  const kf = DATA.bezirke.kauffaelle.find(d => d.bezirk === bezirk);
  const gd = DATA.bezirke.geldumsatz.find(d => d.bezirk === bezirk);
  const fl = DATA.bezirke.flaechenumsatz.find(d => d.bezirk === bezirk);
  const condo = DATA.condo[bezirk] || {};
  const brw = DATA.brw_offen.find(d => d.bezirk === bezirk);

  let html = `<button class="close" onclick="this.parentElement.style.display='none'">×</button>`;
  html += `<h3>🏙️ ${bezirk}</h3>`;

  // Main stats
  if (gd) {
    html += `<div class="val">${gd.gesamt_MioEUR.toFixed(1)} <span class="sub">Mio. €</span></div>`;
    html += `<div class="sub">${gd.gesamt_pct_berlin.toFixed(1)}% des Berliner Geldumsatzes</div>`;
  }

  // Breakdown
  if (gd) {
    html += `<div class="hr"></div>`;
    html += `<table>`;
    html += `<tr><th></th><th>Mio. €</th><th>% Bezirk</th></tr>`;
    html += `<tr><td>Unbebaut</td><td>${gd.unbebaut_MioEUR.toFixed(1)}</td><td>${gd.unbebaut_pct_bezirk.toFixed(1)}%</td></tr>`;
    html += `<tr><td>Bebaut</td><td>${gd.bebaut_MioEUR.toFixed(1)}</td><td>${gd.bebaut_pct_bezirk.toFixed(1)}%</td></tr>`;
    html += `<tr><td>WE/TE</td><td>${gd.we_MioEUR.toFixed(1)}</td><td>${gd.we_pct_bezirk.toFixed(1)}%</td></tr>`;
    html += `</table>`;
  }

  // Kauffälle
  if (kf) {
    html += `<div class="hr"></div>`;
    html += `<div class="row"><span>📋 Kauffälle</span><b>${kf.gesamt_anzahl.toLocaleString()}</b></div>`;
    html += `<div class="row"><span>   — WE</span><b>${kf.we_anzahl.toLocaleString()}</b></div>`;
  }

  // Fläche
  if (fl) {
    html += `<div class="row"><span>📐 Flächenumsatz</span><b>${fl.gesamt_ha.toFixed(1)} ha</b></div>`;
  }

  // Bodenrichtwert
  if (brw) {
    html += `<div class="hr"></div>`;
    html += `<div class="row"><span>🏞️ Bodenrichtwert (offen)</span><b>${brw.bodenrichtwert_min.toFixed(0)} – ${brw.bodenrichtwert_max.toFixed(0)} €/m²</b></div>`;
  }

  // Condo prices
  const condoKeys = Object.keys(condo).filter(k => k.startsWith('resale'));
  if (condoKeys.length) {
    html += `<div class="hr"></div><div class="sub" style="font-weight:600;margin-bottom:2px">🏢 ETW Preise (verteilt)</div>`;
    for (const k of condoKeys.slice(0, 3)) {
      const c = condo[k];
      html += `<div class="row"><span>   ${k.replace('resale_','')}</span><b>${c.preis_pro_qm.toFixed(0)} €/m²</b></div>`;
    }
  }
  if (condo.erstverkauf_neubau) {
    html += `<div class="row"><span>   Neubau</span><b>${condo.erstverkauf_neubau.preis_pro_qm.toFixed(0)} €/m²</b></div>`;
  }

  document.getElementById('tooltip').innerHTML = html;
  document.getElementById('tooltip').style.display = 'block';
}

// ─── Init ──────────────────────────────────────────────────────
async function init() {
  map = L.map('map', {
    center:[52.52,13.405], zoom:11, scrollWheelZoom:true, zoomControl:false,
    minZoom:10, maxZoom:16
  });
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OSM', maxZoom:18
  }).addTo(map);

  // Load GeoJSON
  const r = await fetch('data/processed/berlin-districts-choropleth.geojson');
  geoData = await r.json();

  geoLayer = L.geoJSON(geoData, {
    style: feature => {
      const v = getMetricValue(feature.properties.district, currentMetric);
      const vals = BEZIRKE.map(b => getMetricValue(b, currentMetric)).filter(x => x != null);
      const mn = Math.min(...vals), mx = Math.max(...vals);
      return {fillColor: getColor(v, mn, mx), fillOpacity: 0.25, weight: 2, color: '#5b6a8a', dashArray: '4 2'};
    },
    onEachFeature: (feature, layer) => {
      layer.bindTooltip(`<b>${feature.properties.district}</b>`, {sticky:true});
      layer.on('mouseover', function(){ this.setStyle({fillOpacity:0.45, weight:3, color:'#7b8fbf'}); });
      layer.on('mouseout', function(){ this.setStyle({fillOpacity:0.25, weight:2, color:'#5b6a8a'}); });
      layer.on('click', () => showTooltip(feature.properties.district));
    }
  }).addTo(map);

  buildMap();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
