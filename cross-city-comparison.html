<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mietspiegel — Cross-City Comparison</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --green: #3fb950;
    --green-bg: #0d5320;
    --red: #f85149;
    --red-bg: #6b1d1a;
    --blue: #58a6ff;
    --yellow: #d29922;
    --accent: #1f6feb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px; line-height: 1.5;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
  }
  header h1 {
    font-size: 24px; font-weight: 600;
    background: linear-gradient(135deg, var(--blue), var(--green));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  header p { color: var(--text-dim); font-size: 14px; margin-top: 4px; }
  .controls {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .controls label {
    font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 6px;
  }
  .controls select, .controls input {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .controls select:focus, .controls input:focus { outline: none; border-color: var(--blue); }
  .controls .btn {
    background: var(--accent); color: #fff; border: none;
    padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: opacity .15s;
  }
  .controls .btn:hover { opacity: .85; }
  .controls .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .stats {
    display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 16px; flex: 1; min-width: 140px;
  }
  .stat-card .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; }
  .stat-card .value { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.red { color: var(--red); }
  .stat-card .city { font-size: 12px; color: var(--text-dim); }
  .table-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; overflow-x: auto;
  }
  table {
    width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap;
  }
  thead th {
    background: var(--surface2); padding: 10px 12px;
    text-align: center; font-weight: 600; font-size: 12px;
    border-bottom: 2px solid var(--border);
    position: sticky; top: 0; z-index: 2;
    cursor: pointer; user-select: none;
  }
  thead th:hover { color: var(--blue); }
  thead th .sort-icon { margin-left: 4px; font-size: 10px; opacity: .5; }
  thead th.sorted .sort-icon { opacity: 1; color: var(--blue); }
  thead th:first-child {
    text-align: left; min-width: 160px; cursor: default;
    position: sticky; left: 0; z-index: 3; background: var(--surface2);
  }
  thead th:first-child:hover { color: inherit; }
  td {
    padding: 8px 12px; text-align: center; border-bottom: 1px solid var(--border); position: relative;
  }
  td:first-child {
    text-align: left; font-weight: 500;
    position: sticky; left: 0; z-index: 1; background: var(--surface);
  }
  tr:hover td { background: rgba(88,166,255,0.04); }
  tr:hover td:first-child { background: rgba(88,166,255,0.04); }
  tr:last-child td { border-bottom: none; }
  .cell-value { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .cell-value .num { font-weight: 500; font-variant-numeric: tabular-nums; min-width: 36px; }
  .bar-wrap { width: 40px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; flex-shrink: 0; }
  .bar-fill { height: 100%; border-radius: 2px; transition: width .3s; }
  .cheapest { background: var(--green-bg) !important; }
  .cheapest .num { color: var(--green); font-weight: 700; }
  .most-expensive { background: var(--red-bg) !important; }
  .most-expensive .num { color: var(--red); font-weight: 700; }
  tr:hover .cheapest { background: #0f6b28 !important; }
  tr:hover .most-expensive { background: #8b2522 !important; }
  .summary-row td {
    border-top: 2px solid var(--border); font-weight: 600; background: var(--surface2) !important;
  }
  .summary-row td:first-child { color: var(--yellow); }
  th.asc .sort-icon::after { content: '▲'; }
  th.desc .sort-icon::after { content: '▼'; }
  th:not(.asc):not(.desc) .sort-icon::after { content: '⇅'; opacity: .3; }
  .city-count { font-size: 12px; color: var(--text-dim); margin-top: 8px; }
  .legend { display: flex; gap: 16px; margin-top: 16px; font-size: 12px; color: var(--text-dim); align-items: center; }
  .legend .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
  footer { margin-top: 24px; text-align: center; font-size: 12px; color: var(--text-dim); }
  @media (max-width: 768px) {
    body { padding: 12px; }
    header h1 { font-size: 18px; }
    .controls { width: 100%; }
    .controls select, .controls .btn { flex: 1; }
    td, th { padding: 6px 8px; font-size: 12px; }
    thead th:first-child { min-width: 120px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Mietspiegel Cross-City Comparison</h1>
      <p>Compare official rent index values across German cities — Mittelwert in €/m²</p>
    </div>
    <div class="controls">
      <label>
        Wohnlage
        <select id="lageSelect">
          <option value="mittel">Mittel</option>
          <option value="einfach">Einfach</option>
          <option value="gut">Gut</option>
        </select>
      </label>
      <label>
        Filter Baujahr
        <select id="baujahrFilter">
          <option value="all">Alle Baujahre</option>
        </select>
      </label>
      <label>
        Sortieren nach
        <select id="sortSelect">
          <option value="">— Keine Sortierung —</option>
        </select>
      </label>
      <button class="btn btn-secondary" id="resetBtn">↺ Zurücksetzen</button>
    </div>
  </header>

  <div class="stats" id="statsBar"></div>

  <div class="table-wrap" id="tableWrap">
    <table id="comparisonTable">
      <thead id="tableHead">
        <tr><th>Stadt <span class="sort-icon"></span></th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="city-count" id="cityCount"></div>

  <div class="legend">
    <span><span class="swatch" style="background:var(--green)"></span> Günstigste Stadt</span>
    <span><span class="swatch" style="background:var(--red)"></span> Teuerste Stadt</span>
    <span><span class="swatch" style="background:var(--border)"></span> Andere Städte</span>
  </div>

  <footer>
    Daten aus offiziellen Mietspiegeln der Städte. Mittelwerte aus allen Wohnungsgrößen gemittelt.
    <br>Quelle: <code>data/processed/cities.json</code>
  </footer>
</div>

<script>
async function loadData() {
  const resp = await fetch('data/processed/cities.json');
  return await resp.json();
}

function getMeanForCity(cityData, lage, baujahrGroup) {
  const tables = cityData.tables || [];
  const found = tables.find(t => t.lage === lage && t.baujahr_group === baujahrGroup);
  if (!found || !found.size_rows || found.size_rows.length === 0) return null;
  const vals = found.size_rows.map(r => r.mittelwert).filter(v => v != null);
  return vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : null;
}

function getAllBaujahrGroups(cities) {
  const set = new Set();
  cities.forEach(c => {
    (c.categories?.baujahr_groups || []).forEach(g => set.add(g));
  });
  return Array.from(set);
}

function render(data, lage, filterBaujahr, sortCol, sortDir) {
  const cities = data.filter(c => c.tables && c.tables.length > 0);
  const allPeriods = getAllBaujahrGroups(cities);
  const activePeriods = (filterBaujahr === 'all') ? allPeriods : [filterBaujahr];

  const avgPerPeriod = {};
  for (const p of allPeriods) {
    const vals = cities.map(c => getMeanForCity(c, lage, p)).filter(v => v != null);
    avgPerPeriod[p] = vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : null;
  }

  let rows = cities.map(city => {
    const row = { city, values: {} };
    allPeriods.forEach(p => { row.values[p] = getMeanForCity(city, lage, p); });
    return row;
  });

  if (sortCol && activePeriods.includes(sortCol)) {
    rows.sort((a, b) => {
      const va = a.values[sortCol] ?? -Infinity;
      const vb = b.values[sortCol] ?? -Infinity;
      return sortDir === 'asc' ? va - vb : vb - va;
    });
  }

  const minMax = {};
  for (const p of activePeriods) {
    const vals = rows.map(r => r.values[p]).filter(v => v != null);
    if (vals.length) minMax[p] = { min: Math.min(...vals), max: Math.max(...vals) };
  }

  const allVals = rows.flatMap(r => allPeriods.map(p => r.values[p])).filter(v => v != null);
  const globalMin = Math.min(...allVals);
  const globalMax = Math.max(...allVals);
  const range = globalMax - globalMin || 1;

  // Render header
  const thead = document.getElementById('tableHead');
  thead.innerHTML = '';
  const headRow = document.createElement('tr');
  const cityTh = document.createElement('th');
  cityTh.textContent = 'Stadt';
  const sortIcon = document.createElement('span'); sortIcon.className = 'sort-icon';
  cityTh.appendChild(sortIcon);
  headRow.appendChild(cityTh);

  activePeriods.forEach(p => {
    const th = document.createElement('th');
    th.dataset.col = p;
    th.className = (sortCol === p) ? (sortDir === 'asc' ? 'asc' : 'desc') : '';
    const label = document.createElement('span');
    label.textContent = p;
    th.appendChild(label);
    const icon = document.createElement('span'); icon.className = 'sort-icon';
    th.appendChild(icon);
    const avgLabel = document.createElement('div');
    const avg = avgPerPeriod[p];
    avgLabel.style.cssText = 'font-size:10px;color:var(--text-dim);font-weight:400;margin-top:2px;';
    avgLabel.textContent = avg ? `Ø ${avg.toFixed(2)} €` : '—';
    th.appendChild(avgLabel);
    th.addEventListener('click', () => {
      const newDir = (sortCol === p && sortDir === 'asc') ? 'desc' : 'asc';
      document.getElementById('sortSelect').value = p;
      render(data, lage, filterBaujahr, p, newDir);
    });
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  rows.forEach(row => {
    const tr = document.createElement('tr');
    const cityTd = document.createElement('td');
    const citySpan = document.createElement('span');
    citySpan.textContent = row.city.city;
    cityTd.appendChild(citySpan);
    const stateSpan = document.createElement('div');
    stateSpan.style.cssText = 'font-size:10px;color:var(--text-dim);font-weight:400;';
    stateSpan.textContent = row.city.state;
    cityTd.appendChild(stateSpan);
    tr.appendChild(cityTd);

    activePeriods.forEach(p => {
      const td = document.createElement('td');
      const val = row.values[p];
      const mm = minMax[p];
      if (val != null) {
        if (mm && val === mm.min && val !== mm.max) td.classList.add('cheapest');
        if (mm && val === mm.max && val !== mm.min) td.classList.add('most-expensive');
        const wrapper = document.createElement('div'); wrapper.className = 'cell-value';
        const num = document.createElement('span'); num.className = 'num';
        num.textContent = val.toFixed(2);
        wrapper.appendChild(num);
        const barW = document.createElement('div'); barW.className = 'bar-wrap';
        const barF = document.createElement('div'); barF.className = 'bar-fill';
        const pct = ((val - globalMin) / range) * 100;
        barF.style.width = Math.max(8, Math.min(100, pct)) + '%';
        const r = Math.round(63 + (248 - 63) * (pct / 100));
        const g = Math.round(185 - (185 - 81) * (pct / 100));
        const b = Math.round(80 - (80 - 73) * (pct / 100));
        barF.style.background = `rgb(${r},${g},${b})`;
        barW.appendChild(barF);
        wrapper.appendChild(barW);
        td.appendChild(wrapper);
      } else {
        td.textContent = '—'; td.style.color = 'var(--text-dim)';
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  // Summary row
  const sumTr = document.createElement('tr'); sumTr.className = 'summary-row';
  const sumTd = document.createElement('td'); sumTd.textContent = 'Ø Deutschland';
  sumTr.appendChild(sumTd);
  activePeriods.forEach(p => {
    const td = document.createElement('td');
    const avg = avgPerPeriod[p];
    td.textContent = avg ? avg.toFixed(2) + ' €' : '—';
    td.style.fontWeight = '600';
    sumTr.appendChild(td);
  });
  tbody.appendChild(sumTr);

  updateStats(data, lage, filterBaujahr, rows, activePeriods, avgPerPeriod);
  document.getElementById('cityCount').textContent = `${rows.length} Städte`;
}

function updateStats(data, lage, filterBaujahr, rows, activePeriods, avgPerPeriod) {
  const allVals = [];
  rows.forEach(r => {
    activePeriods.forEach(p => {
      const v = r.values[p];
      if (v != null) allVals.push({ city: r.city.city, period: p, value: v, state: r.city.state });
    });
  });
  if (!allVals.length) { document.getElementById('statsBar').innerHTML = ''; return; }
  allVals.sort((a,b) => a.value - b.value);
  const cheapest = allVals[0];
  const mostExp = allVals[allVals.length-1];
  const avg = allVals.reduce((a,b) => a+b.value, 0) / allVals.length;
  const bars = document.getElementById('statsBar');
  const filterLabel = filterBaujahr === 'all' ? 'alle Baujahre' : filterBaujahr;
  bars.innerHTML = `
    <div class="stat-card">
      <div class="label">Günstigster Mietspiegel</div>
      <div class="value green">${cheapest.value.toFixed(2)} €/m²</div>
      <div class="city">${cheapest.city} (${cheapest.period})</div>
    </div>
    <div class="stat-card">
      <div class="label">Teuerster Mietspiegel</div>
      <div class="value red">${mostExp.value.toFixed(2)} €/m²</div>
      <div class="city">${mostExp.city} (${mostExp.period})</div>
    </div>
    <div class="stat-card">
      <div class="label">Ø Alle Städte</div>
      <div class="value">${avg.toFixed(2)} €/m²</div>
      <div class="city">${rows.length} Städte · ${filterLabel} · Wohnlage: ${lage}</div>
    </div>
    <div class="stat-card">
      <div class="label">Spanne</div>
      <div class="value">${(mostExp.value - cheapest.value).toFixed(2)} €</div>
      <div class="city">${cheapest.value.toFixed(2)} – ${mostExp.value.toFixed(2)} €/m²</div>
    </div>
  `;
}

async function init() {
  const data = await loadData();
  const allPeriods = getAllBaujahrGroups(data);

  const bFilter = document.getElementById('baujahrFilter');
  bFilter.innerHTML = '<option value="all">Alle Baujahre</option>';
  allPeriods.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; bFilter.appendChild(o); });

  const sSelect = document.getElementById('sortSelect');
  sSelect.innerHTML = '<option value="">— Keine Sortierung —</option>';
  allPeriods.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; sSelect.appendChild(o); });

  let state = { lage: 'mittel', filterBaujahr: 'all', sortCol: '', sortDir: 'asc' };
  function reRender() { render(data, state.lage, state.filterBaujahr, state.sortCol || null, state.sortDir); }

  document.getElementById('lageSelect').addEventListener('change', e => { state.lage = e.target.value; reRender(); });
  document.getElementById('baujahrFilter').addEventListener('change', e => { state.filterBaujahr = e.target.value; state.sortCol = ''; document.getElementById('sortSelect').value = ''; reRender(); });
  document.getElementById('sortSelect').addEventListener('change', e => { state.sortCol = e.target.value; state.sortDir = 'asc'; reRender(); });
  document.getElementById('resetBtn').addEventListener('click', () => {
    state = { lage: 'mittel', filterBaujahr: 'all', sortCol: '', sortDir: 'asc' };
    document.getElementById('lageSelect').value = 'mittel';
    document.getElementById('baujahrFilter').value = 'all';
    document.getElementById('sortSelect').value = '';
    reRender();
  });

  render(data, state.lage, state.filterBaujahr, null, 'asc');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
