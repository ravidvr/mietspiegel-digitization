<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mietspiegel Dashboard — German Rent Index Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d28;
  --card-hover: #222639;
  --border: #2a2e3e;
  --text: #e4e6f0;
  --text-dim: #8b8fa3;
  --accent: #5b8def;
  --accent2: #6c5ce7;
  --green: #48bb78;
  --yellow: #ecc94b;
  --red: #f56565;
  --orange: #ed8936;
  --header-bg: #151821;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  overflow-x: hidden;
}

/* Header */
.header {
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.header h1 {
  font-size: 20px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.header h1 span { color: var(--accent); }
.header .subtitle { font-size: 13px; color: var(--text-dim); }
.header .badge {
  background: var(--accent);
  color: #fff;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 600;
}

/* Layout */
.main-layout {
  display: flex;
  height: calc(100vh - 70px);
}
.map-panel {
  flex: 1;
  min-width: 0;
  position: relative;
}
.side-panel {
  width: 420px;
  min-width: 320px;
  max-width: 50vw;
  background: var(--card);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#map { width: 100%; height: 100%; }

/* Side panel */
.panel-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--header-bg);
}
.panel-tab {
  flex: 1;
  padding: 10px 12px;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: 0.2s;
}
.panel-tab:hover { color: var(--text); }
.panel-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.panel-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

/* Stadtinfo header */
.city-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.city-header h2 { font-size: 22px; font-weight: 700; }
.city-header .state { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
.city-header .pop { font-size: 12px; color: var(--text-dim); }
.city-header .year-badge {
  background: var(--accent2);
  color: #fff;
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 6px;
  font-weight: 600;
  white-space: nowrap;
}

/* Lage selector */
.lage-selector {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.lage-btn {
  padding: 6px 16px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text-dim);
  cursor: pointer;
  transition: 0.2s;
}
.lage-btn:hover { border-color: var(--accent); color: var(--text); }
.lage-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Tables */
.table-wrap {
  overflow-x: auto;
  margin-bottom: 12px;
}
table.miet-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
table.miet-table th, table.miet-table td {
  padding: 6px 8px;
  text-align: center;
  border: 1px solid var(--border);
  white-space: nowrap;
}
table.miet-table th {
  background: var(--header-bg);
  color: var(--text-dim);
  font-weight: 600;
  font-size: 11px;
}
table.miet-table td:first-child {
  text-align: left;
  font-weight: 600;
  color: var(--text);
}
table.miet-table td { color: var(--text); }

/* Legend */
.map-legend {
  position: absolute;
  bottom: 24px;
  left: 24px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  z-index: 1000;
}
.map-legend .row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 3px 0;
}
.map-legend .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

/* Comparison table */
.comparison-table-wrap {
  overflow-x: auto;
}
table.compare-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
table.compare-table th, table.compare-table td {
  padding: 6px 8px;
  text-align: center;
  border: 1px solid var(--border);
}
table.compare-table th {
  background: var(--header-bg);
  color: var(--text-dim);
  font-weight: 600;
  font-size: 11px;
  position: sticky;
  top: 0;
}
table.compare-table td:first-child {
  text-align: left;
  font-weight: 600;
  color: var(--text-dim);
}
table.compare-table .header-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
}
table.compare-table .header-cell .city-name { font-weight: 600; color: var(--text); font-size: 12px; }
table.compare-table .header-cell .city-state { font-size: 10px; color: var(--text-dim); }
.rank-1 { color: var(--green); font-weight: 700; }
.rank-2 { color: var(--yellow); font-weight: 700; }
.rank-10 { color: var(--red); font-weight: 700; }

/* Loading/select states */
.select-city-msg {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  font-size: 14px;
  text-align: center;
  padding: 24px;
}
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  color: var(--text-dim);
  gap: 8px;
}
.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Search */
.search-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.search-bar input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  outline: none;
}
.search-bar input:focus { border-color: var(--accent); }
.search-bar input::placeholder { color: var(--text-dim); }

/* City list for tab */
.city-list { display: flex; flex-direction: column; gap: 6px; }
.city-list-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}
.city-list-item:hover { background: var(--card-hover); border-color: var(--accent); }
.city-list-item .cl-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.city-list-item .cl-name { font-weight: 600; font-size: 14px; flex: 1; }
.city-list-item .cl-state { font-size: 12px; color: var(--text-dim); }
.city-list-item .cl-rent { font-size: 13px; font-weight: 700; }
.city-list-item .cl-detail { font-size: 12px; color: var(--text-dim); }

/* Responsive */
@media (max-width: 768px) {
  .main-layout { flex-direction: column; height: auto; }
  .map-panel { height: 50vh; }
  .side-panel { width: 100%; max-width: 100%; border-left: none; border-top: 1px solid var(--border); }
}

/* Popup styling */
.leaflet-popup-content-wrapper {
  background: var(--card) !important;
  color: var(--text) !important;
  border: 1px solid var(--border) !important;
  border-radius: 8px !important;
  font-family: inherit;
}
.leaflet-popup-content { margin: 10px 14px !important; }
.leaflet-popup-tip { background: var(--card) !important; border: 1px solid var(--border) !important; }
.leaflet-popup-close-button { color: var(--text-dim) !important; }
.popup-city { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.popup-rent { font-size: 22px; font-weight: 700; color: var(--accent); }
.popup-label { font-size: 11px; color: var(--text-dim); }

/* Compare filter */
.filter-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.filter-row select {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
  outline: none;
}
.filter-row select:focus { border-color: var(--accent); }

/* Sort indicator */
.sort-indicator {
  font-size: 10px;
  margin-left: 3px;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🏠 Mietspiegel <span>Dashboard</span></h1>
    <div class="subtitle">Official German rent index data — compared across cities</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <span class="badge">MVP · 10 cities</span>
    <span class="badge" style="background:var(--green);">2024–2025</span>
    <a href="https://github.com/ravidvr/mietspiegel-digitization" style="color:var(--accent);font-size:13px;text-decoration:none;">GitHub</a>
  </div>
</div>

<div class="main-layout">
  <div class="map-panel">
    <div id="map"></div>
    <div class="map-legend">
      <div style="font-weight:600;margin-bottom:4px;font-size:13px;">Ø Net Cold Rent</div>
      <div class="row"><span class="dot" style="background:var(--green);"></span> &lt; €10/m²</div>
      <div class="row"><span class="dot" style="background:var(--yellow);"></span> €10–14/m²</div>
      <div class="row"><span class="dot" style="background:var(--orange);"></span> €14–18/m²</div>
      <div class="row"><span class="dot" style="background:var(--red);"></span> &gt; €18/m²</div>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-tabs">
      <div class="panel-tab active" data-tab="detail" onclick="switchTab('detail')">City Detail</div>
      <div class="panel-tab" data-tab="compare" onclick="switchTab('compare')">Compare</div>
      <div class="panel-tab" data-tab="list" onclick="switchTab('list')">All Cities</div>
    </div>

    <div class="panel-content" id="panel-detail">
      <div class="select-city-msg">
        <div>👆 Click a city marker on the map<br><span style="font-size:12px;color:var(--text-dim);">or select from the list tab</span></div>
      </div>
    </div>

    <div class="panel-content" id="panel-compare" style="display:none;">
      <div class="filter-row">
        <select id="compare-lage" onchange="updateComparison()">
          <option value="mittel">Mittlere Lage</option>
          <option value="einfach">Einfache Lage</option>
          <option value="gut">Gute Lage</option>
        </select>
        <select id="compare-size" onchange="updateComparison()">
          <option value="40_60">40–60 m²</option>
          <option value="bis_40">&lt; 40 m²</option>
          <option value="60_90">60–90 m²</option>
          <option value="ueber_90">&gt; 90 m²</option>
        </select>
        <select id="compare-baujahr" onchange="updateComparison()">
          <option value="1965-1974">1965–1974</option>
          <option value="bis 1918">&lt; 1918</option>
          <option value="1919-1949">1919–1949</option>
          <option value="1950-1964">1950–1964</option>
          <option value="1975-1990">1975–1990</option>
          <option value="1991-2002">1991–2002</option>
          <option value="2003-2013">2003–2013</option>
          <option value="2014+">2014+</option>
        </select>
      </div>
      <div class="comparison-table-wrap" id="compare-table-wrap">
        <div class="loading"><div class="spinner"></div> Loading data...</div>
      </div>
    </div>

    <div class="panel-content" id="panel-list" style="display:none;">
      <div class="search-bar">
        <input type="text" id="city-search" placeholder="Search cities..." oninput="filterCityList()">
      </div>
      <div class="city-list" id="city-list"></div>
    </div>
  </div>
</div>

<script>
// State
const CITIES_INDEX = 'data/processed/cities_index.json';
const CITY_DATA_PATH = 'data/processed/';
let cities = [];
let cityDataCache = {};
let map = null;
let markers = [];
let selectedCity = null;

// Init
async function init() {
  map = L.map('map', {
    center: [51.1657, 10.4515],
    zoom: 6,
    zoomControl: true,
    attributionControl: true,
    scrollWheelZoom: true
  });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://openstreetmap.org">OSM</a>',
    maxZoom: 18
  }).addTo(map);

  const resp = await fetch(CITIES_INDEX);
  cities = await resp.json();
  renderCityList();
  addMarkers();
}

function getRentColor(avgRent) {
  if (avgRent < 10) return '#48bb78';
  if (avgRent < 14) return '#ecc94b';
  if (avgRent < 18) return '#ed8936';
  return '#f56565';
}

function getAvgCityRent(cityData) {
  const mid = cityData.tables.find(t => t.lage === 'mittel');
  if (!mid) return 12;
  const vals = mid.rows.map(r => r['40_60'] || r.bis_40 || 0);
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function addMarkers() {
  cities.forEach(c => {
    const resp2 = fetch(CITY_DATA_PATH + c.slug + '.json');
    resp2.then(r => r.json()).then(data => {
      cityDataCache[c.slug] = data;
      const avg = getAvgCityRent(data);
      const color = getRentColor(avg);
      const marker = L.circleMarker([c.lat, c.lng], {
        radius: 12,
        fillColor: color,
        color: '#fff',
        weight: 2,
        opacity: 1,
        fillOpacity: 0.85
      }).addTo(map);
      marker.bindPopup(`
        <div class="popup-city">${c.city}</div>
        <div class="popup-label">${c.state} · ${data.year}</div>
        <div class="popup-rent">ø €${avg.toFixed(1)}/m²</div>
        <div class="popup-label">Mittlere Lage, 40–60m²</div>
      `);
      marker.on('click', () => showCityDetail(c.slug));
      markers.push(marker);
    });
  });
}

async function showCityDetail(slug) {
  let data = cityDataCache[slug];
  if (!data) {
    const resp = await fetch(CITY_DATA_PATH + slug + '.json');
    data = await resp.json();
    cityDataCache[slug] = data;
  }
  selectedCity = slug;
  switchTab('detail');

  const meta = cities.find(c => c.slug === slug);
  const panel = document.getElementById('panel-detail');
  
  // Pick first available lage if 'mittel' not present
  let currentLage = 'mittel';
  if (!data.tables || data.tables.length === 0) {
    panel.innerHTML = `<div class="select-city-msg"><div>📊 ${data.city}<br><span style="font-size:12px;color:var(--text-dim);">Data extracted — detailed table view not yet available for this city.</span></div></div>`;
    return;
  }
  const hasLage = data.tables.find(t => t.lage === currentLage);
  if (!hasLage && data.tables.length > 0) {
    currentLage = data.tables[0].lage;
  }
  renderDetail(slug, data, meta, currentLage);
  window._detailData = { slug, data, meta };

  // Fly map
  const marker = markers.find(m => {
    const ll = m.getLatLng();
    return Math.abs(ll.lat - meta.lat) < 0.1 && Math.abs(ll.lng - meta.lng) < 0.1;
  });
  if (marker) map.flyTo([meta.lat, meta.lng], 9, { duration: 0.8 });
}

function renderDetail(slug, data, meta, lage) {
  const panel = document.getElementById('panel-detail');
  const lageTable = data.tables.find(t => t.lage === lage);
  const avgRent = getAvgCityRent(data);

  let baujahrHeaders = data.baujahr_groups.map(b => `<th>${b}</th>`).join('');
  let sizeRows = data.size_categories.map(size => {
    const key = size === 'bis 40 m²' ? 'bis_40' :
                size === '40-60 m²' ? '40_60' :
                size === '60-90 m²' ? '60_90' : 'ueber_90';
    let vals = lageTable.rows.map(r => `<td>€${r[key]?.toFixed(2)}</td>`).join('');
    return `<tr><td>${size}</td>${vals}</tr>`;
  }).join('');

  panel.innerHTML = `
    <div class="city-header">
      <div>
        <h2>${data.city}</h2>
        <div class="state">${data.state} · ${(meta?.population || 0).toLocaleString()} residents</div>
      </div>
      <div class="year-badge">${data.year} · ${data.type}</div>
    </div>
    <div class="lage-selector">
      ${data.lage_categories.map(l => `<div class="lage-btn ${l === lage ? 'active' : ''}" onclick="switchLage('${l}')">${capitalize(l)}</div>`).join('')}
    </div>
    <div class="table-wrap">
      <table class="miet-table">
        <thead><tr><th>Size</th>${baujahrHeaders}</tr></thead>
        <tbody>${sizeRows}</tbody>
      </table>
    </div>
    <div style="font-size:11px;color:var(--text-dim);">
      <strong>Net cold rent</strong> (€/m²/month) · ${data.city} Mietspiegel ${data.year}
      · <a href="${data.source_url || '#'}" style="color:var(--accent);" target="_blank">Source</a>
    </div>
  `;
}

function switchLage(lage) {
  if (!window._detailData) return;
  const { slug, data, meta } = window._detailData;
  renderDetail(slug, data, meta, lage);
  // Update active class
  document.querySelectorAll('.lage-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim().toLowerCase() === lage);
  });
}

// Comparison
async function updateComparison() {
  const lage = document.getElementById('compare-lage').value;
  const size = document.getElementById('compare-size').value;
  const baujahr = document.getElementById('compare-baujahr').value;
  const wrap = document.getElementById('compare-table-wrap');

  // Load all city data
  const loadPromises = cities.map(async c => {
    if (!cityDataCache[c.slug]) {
      const r = await fetch(CITY_DATA_PATH + c.slug + '.json');
      cityDataCache[c.slug] = await r.json();
    }
    return cityDataCache[c.slug];
  });
  const allData = await Promise.all(loadPromises);

  // Build table
  let baujahrOptions = allData[0].baujahr_groups;
  let sizeOptions = allData[0].size_categories;
  const sizeKey = size;
  const sizeLabel = sizeOptions.find(s =>
    s === 'bis 40 m²' ? sizeKey === 'bis_40' :
    s === '40-60 m²' ? sizeKey === '40_60' :
    s === '60-90 m²' ? sizeKey === '60_90' :
    s === 'über 90 m²' ? sizeKey === 'ueber_90' : false
  ) || '40–60 m²';

  let entries = allData.map(d => {
    const tb = d.tables.find(t => t.lage === lage);
    if (!tb) return null;
    const row = tb.rows.find(r => r.baujahr === baujahr);
    if (!row) return null;
    return { city: d.city, slug: d.city_slug, rent: row[sizeKey], data: d };
  }).filter(Boolean).sort((a, b) => a.rent - b.rent);

  // City header cells
  let cityHeaders = entries.map((e, i) => `
    <th>
      <div class="header-cell">
        <span class="city-name" onclick="showCityDetail('${e.slug}')" style="cursor:pointer;">${e.city}</span>
        <span class="city-state">${e.data.state}</span>
      </div>
    </th>
  `).join('');

  // Baujahr rows
  let baujahrRows = baujahrOptions.map(bj => {
    let cells = entries.map((e, i) => {
      const row = e.data.tables.find(t => t.lage === lage)?.rows.find(r => r.baujahr === bj);
      const val = row ? row[sizeKey] : null;
      if (!val) return '<td>—</td>';
      return `<td>€${val.toFixed(2)}</td>`;
    }).join('');
    return `<tr><td style="text-align:left;font-weight:600;">${bj}</td>${cells}</tr>`;
  }).join('');

  wrap.innerHTML = `
    <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">
      Showing <strong>${capitalize(lage)} Lage</strong> · <strong>${sizeLabel}</strong> · sorted by rent (low→high)
    </div>
    <table class="compare-table">
      <thead><tr><th style="width:80px;">Baujahr</th>${cityHeaders}</tr></thead>
      <tbody>${baujahrRows}</tbody>
    </table>
  `;
}

// Tabs
function switchTab(tab) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('panel-detail').style.display = tab === 'detail' ? 'block' : 'none';
  document.getElementById('panel-compare').style.display = tab === 'compare' ? 'block' : 'none';
  document.getElementById('panel-list').style.display = tab === 'list' ? 'block' : 'none';
  if (tab === 'compare') updateComparison().catch(() => {});
}

// City list
function renderCityList(filter) {
  const list = document.getElementById('city-list');
  let filtered = filter
    ? cities.filter(c => c.city.toLowerCase().includes(filter.toLowerCase()) || c.state.toLowerCase().includes(filter.toLowerCase()))
    : cities;
  list.innerHTML = filtered.map(c => {
    const d = cityDataCache[c.slug];
    const avg = d ? getAvgCityRent(d) : 0;
    const color = d ? getRentColor(avg) : '#666';
    return `<div class="city-list-item" onclick="showCityDetail('${c.slug}')">
      <span class="cl-dot" style="background:${color}"></span>
      <span class="cl-name">${c.city}</span>
      <span class="cl-state">${c.state}</span>
      ${d ? `<span class="cl-rent">€${avg.toFixed(1)}</span>` : '<span class="cl-detail">loading...</span>'}
    </div>`;
  }).join('');
  document.querySelectorAll('.city-list-item').forEach(el => {
    // events handled by onclick in template
  });
}

function filterCityList() {
  renderCityList(document.getElementById('city-search').value);
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// Init on load
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
