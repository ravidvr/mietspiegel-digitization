[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mietspiegel-digitization"
version = "0.1.0"
description = "Digitizing German municipal rent indices (Mietspiegel) — 23 cities, 3 reconciled data sources"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ravi Dronamraju" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "PyMuPDF>=1.23",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "shapely>=2.0",
    "camelot-py>=0.11",
    "scipy>=1.13",
    "jsonschema>=4.22",
    "pyproj>=3.6",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E741", "F541", "B007", "B905", "E712", "E402", "W293", "F841", "UP035", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["scripts", "validate", "experiments"]
branch = true

[tool.coverage.report]
show_missing = true
